name: Build Android APK

on:
  workflow_dispatch: # يسمح بتشغيل البناء يدويًا من واجهة GitHub
  push:
    branches: [ main, master ] # يعمل تلقائيًا عند الرفع إلى الفرع الرئيسي

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x ./android/gradlew # منح صلاحية التنفيذ لملف Gradle

    - name: Build Debug APK
      working-directory: ./android # تحديد مجلد العمل كمجلد الأندرويد
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk # مسار ملف APK الناتج 