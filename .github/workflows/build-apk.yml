name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Diagnose Android folder structure
      run: |
        echo "===== محتوى مجلد android ====="
        ls -la ./android
        echo ""
        echo "===== البحث عن ملفات gradle داخل android ====="
        find ./android -name "*.gradle*" -type f 2>/dev/null
        echo ""
        echo "===== البحث عن gradlew داخل android ====="
        find ./android -name "gradlew" -type f 2>/dev/null || echo "gradlew غير موجود"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Accept Android SDK licenses
      run: |
        SDKMANAGER=$(find $ANDROID_HOME -name sdkmanager -type f 2>/dev/null | head -n 1)
        yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > ./android/local.properties

    - name: Build Debug APK
      working-directory: ./android
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
        else
          echo "استخدام Gradle المثبت عالمياً لأن gradlew غير موجود..."
          gradle assembleDebug --stacktrace --no-daemon
        fi

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk