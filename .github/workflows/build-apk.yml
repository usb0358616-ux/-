name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Diagnose repository structure
      run: |
        echo "===== محتوى الجذر ====="
        ls -la
        echo ""
        echo "===== البحث عن gradlew ====="
        find . -name "gradlew" -type f 2>/dev/null || echo "لم يتم إيجاد gradlew"
        echo ""
        echo "===== البحث عن settings.gradle ====="
        find . -name "settings.gradle*" -type f 2>/dev/null || echo "لم يتم إيجاد settings.gradle"
        echo ""
        echo "===== البحث عن build.gradle ====="
        find . -name "build.gradle*" -type f 2>/dev/null | head -20 || echo "لم يتم إيجاد build.gradle"
        echo ""
        echo "===== البحث عن AndroidManifest.xml ====="
        find . -name "AndroidManifest.xml" -type f 2>/dev/null | head -5

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Accept Android SDK licenses
      run: |
        SDKMANAGER=$(find $ANDROID_HOME -name sdkmanager -type f 2>/dev/null | head -n 1)
        yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

    - name: Detect Android project root
      id: detect
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" -type f 2>/dev/null | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "::error::gradlew غير موجود في المستودع. يرجى إضافته إلى Git."
          exit 1
        fi
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "تم اكتشاف جذر المشروع في: $PROJECT_DIR"
        echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > "${{ steps.detect.outputs.project_dir }}/local.properties"

    - name: Grant execute permission
      run: chmod +x "${{ steps.detect.outputs.project_dir }}/gradlew"

    - name: Build Debug APK
      working-directory: ${{ steps.detect.outputs.project_dir }}
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: ${{ steps.detect.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk