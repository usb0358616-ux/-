name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Accept Android SDK licenses
      run: |
        # البحث عن أداة sdkmanager داخل SDK المثبت مسبقًا
        SDKMANAGER=$(find $ANDROID_HOME -name sdkmanager -type f 2>/dev/null | head -n 1)
        echo "Using sdkmanager at: $SDKMANAGER"
        # قبول كل التراخيص تلقائيًا
        yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > ./android/local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x ./android/gradlew

    - name: Build Debug APK
      working-directory: ./android
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk