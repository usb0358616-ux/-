name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Accept Android SDK licenses and install packages
      run: |
        # البحث عن sdkmanager في بيئة GitHub
        SDKMANAGER=$(find $ANDROID_HOME -name sdkmanager -type f | head -n 1)
        echo "Using sdkmanager at: $SDKMANAGER"
        
        # قبول كافة التراخيص تلقائياً
        yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
        
        # تثبيت الحزم المطلوبة لمشروعك (Android 33 و Build Tools)
        "$SDKMANAGER" "platforms;android-33" "build-tools;33.0.2" "platform-tools"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Create configuration files
      run: |
        echo "sdk.dir=$ANDROID_HOME" > ./android/local.properties
        cat > ./android/gradle.properties <<EOF
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.enableJetifier=true
        kotlin.code.style=official
        EOF

    - name: Build Debug APK
      working-directory: ./android
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
        else
          gradle assembleDebug --stacktrace --no-daemon
        fi

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk