name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK packages
      run: |
        SDKMANAGER=$(find $ANDROID_HOME -name sdkmanager -type f | head -n 1)
        yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
        "$SDKMANAGER" "platforms;android-33" "build-tools;33.0.2" "platform-tools"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Create configuration files
      run: |
        echo "sdk.dir=$ANDROID_HOME" > ./android/local.properties
        cat > ./android/gradle.properties <<EOF
        org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
        org.gradle.parallel=true
        org.gradle.caching=true
        android.useAndroidX=true
        android.enableJetifier=true
        kotlin.code.style=official
        EOF

    - name: Check for required resources
      run: |
        echo "===== البحث عن themes.xml أو styles.xml ====="
        find ./android/app/src/main/res -name "themes.xml" -o -name "styles.xml" || echo "مفقود!"
        echo "===== البحث عن file_paths.xml ====="
        find ./android/app/src/main/res -name "file_paths.xml" || echo "مفقود!"
        echo "===== البحث عن data_extraction_rules.xml ====="
        find ./android/app/src/main/res -name "data_extraction_rules.xml" || echo "مفقود!"

    - name: Build Debug APK
      id: build_apk
      working-directory: ./android
      run: |
        # نوجه السجل لملف صغير لتسهيل قراءته
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon > build_error_log.txt 2>&1
        else
          gradle assembleDebug --stacktrace --no-daemon > build_error_log.txt 2>&1
        fi

    - name: Upload Build Log (في حال الفشل)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-error-log
        path: android/build_error_log.txt

    - name: Upload APK (في حال النجاح)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk