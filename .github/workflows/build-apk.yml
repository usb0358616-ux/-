name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android Platforms and Build Tools
      shell: bash
      run: |
        yes | sdkmanager --licenses
        sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.2"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.2.2'

    - name: Create Android configuration files
      run: |
        echo "sdk.dir=$ANDROID_HOME" > ./android/local.properties
        cat > ./android/gradle.properties <<EOF
        org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
        org.gradle.parallel=true
        org.gradle.caching=true
        android.useAndroidX=true
        android.enableJetifier=true
        kotlin.code.style=official
        EOF

    - name: Check required Android resources
      run: |
        echo "===== فحص الموارد الأساسية ====="
        find ./android/app/src/main/res -name "themes.xml"
        find ./android/app/src/main/res -name "file_paths.xml"
        find ./android/app/src/main/res -name "data_extraction_rules.xml"

    - name: Build Debug APK
      id: build_apk
      working-directory: ./android
      run: |
        gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build_error_log.txt

    - name: Upload Build Log (في حال الفشل)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-error-log
        path: android/build_error_log.txt

    - name: Upload APK (في حال النجاح)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
